<!DOCTYPE html>
<html lang="en">
<head>

    <title>500 — Server Error</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; display: flex; align-items: center;
               justify-content: center; min-height: 100vh; margin: 0; color: #333; }

        h2 { margin: 0.2em 0 1em; }
        a { color: #007bff; text-decoration: none; }
        a:hover { text-decoration: underline; }

</head>

    <div class="card">
        <h1>500</h1>
